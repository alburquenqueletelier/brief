# smartengage.alburquenque.net
# Smart Engage — NextJs (Docker, puerto 3000)
#
# DEPLOY:
#   sudo cp smartengage.alburquenque.net.conf /etc/nginx/sites-available/smartengage.alburquenque.net
#   sudo ln -s /etc/nginx/sites-available/smartengage.alburquenque.net /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d smartengage.alburquenque.net   ← agrega el bloque SSL automáticamente

server {
    listen 80;
    listen [::]:80;
    server_name smartengage.alburquenque.net;

    add_header X-Frame-Options   "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff" always;

    # Drop scanner traffic — no response, starves bots
    location ~* \.(php|asp|aspx|jsp|cgi|sh|py|rb|pl)$ { return 444; }
    location ~* /(wp-|xmlrpc|\.env|\.git|phpmyadmin|adminer|\.htaccess|\.htpasswd) { return 444; }

    location / {
        limit_req zone=general burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
    }
}
