# Rate limiting zones
# Must live in nginx http context — place in /etc/nginx/conf.d/
#
# DEPLOY:
#   sudo cp rate-limiting.conf /etc/nginx/conf.d/rate-limiting.conf
#   sudo nginx -t && sudo systemctl reload nginx

# 20 req/min per IP for proxied services (API, Next.js, FastAPI)
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/m;

# Higher limit for static assets (aerium frontend)
limit_req_zone $binary_remote_addr zone=assets:10m rate=300r/m;
